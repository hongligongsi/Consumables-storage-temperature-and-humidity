[env:esp32-s3-n16r8]
; 锁回 core 2.x:保留 ledcSetup/ledcAttachPin 旧 API(main.cpp 热控 PWM 仍用)。
; core 3.x 已移除该 API,升级平台前必须先迁移 ledc 调用。
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = arduino
monitor_speed = 115200
; 921600 在部分 USB 线/集线器/原生 USB-CDC 口上会在写到 9x% 时掉线,
; 表现为 pySerial PermissionError(13, '拒绝访问') —— 串口句柄中途失效。
; 降到 460800 可显著降低中断概率;仍失败时临时改 115200 复测。
upload_speed = 460800
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = qspi
; 含 OTA app0/app1 槽,ArduinoOTA 写入需要。
board_build.partitions = default_16MB.csv
; 本板的 8MB OPI PSRAM 硬件不可用:heap_caps 上报 8MB 全空闲、200B 分配正常,
; 但 64KB 起的大块分配会把总线挂死并触发任务看门狗复位(实测内部 RAM 64K 成功、
; PSRAM 64K 卡死)。而 qio_opi 变体的 sdkconfig 里
; CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1,WiFi/LWIP 的缓冲区正是往 PSRAM 分配的,
; 于是 WiFi.mode(WIFI_STA) 必然卡死 —— 这就是「看不到 WiFi」的根因。
; 处置:SDK 换用 qio_qspi 变体(PSRAM 走 QSPI 时序初始化)。本板物理上是 OPI
; PSRAM,QSPI 初始化必然失败,psramFound() 返回 0、PSRAM 不并入堆,
; 所有分配回到内部 RAM(实测 free=313908/largest=286708,足够跑
; WiFi + WiFiManager + WebServer + MQTT)。
; 若 PSRAM 修好或换板:改回 memory_type=qio_opi、psram_type=opi,并恢复下面两个宏。
;   -DBOARD_HAS_PSRAM
;   -DCONFIG_SPIRAM_SUPPORT=1
build_flags =
  -DCONFIG_IDF_TARGET_ESP32S3=1
  ; TFT_eSPI 在 ESP32-S3 上必须显式选 FSPI 端口,否则 SPI 寄存器基址算成 0:
  ;   TFT_eSPI.h 用 #if defined(CONFIG_IDF_TARGET_ESP32S3) 选 Processors/TFT_eSPI_ESP32_S3.h,
  ;   该宏只存在于 sdkconfig.h、不会传给编译器,缺失会退回通用 TFT_eSPI_ESP32.h;
  ;   进 S3 头后 SPI_PORT 默认为 FSPI(=1),而 IDF soc.h 的 REG_SPI_BASE 只对 i>=2 映射
  ;   GPSPI2(i=1 得到 0),TFT 自带的 #ifndef REG_SPI_BASE 补丁又因 soc.h 已定义而失效,
  ;   于是 SPI_USER_REG = 0x0+0x10 = 0x10,init() 里 SET_BUS_WRITE_MODE 往地址 16 写寄存器
  ;   → StoreProhibited 崩溃(EXCVADDR=0x00000010),tft.init() 后面的 network.begin() 永远
  ;   执行不到,所以看不到 WiFi。
  ; 加 USE_FSPI_PORT 后 SPI_PORT=2,REG_SPI_BASE(2)=DR_REG_SPI2_BASE(0x60024000),
  ; 且库内改用 SPIClass spi(FSPI),与全局 SPI 一致。
  -DUSE_FSPI_PORT
  ; Serial 默认走 S3 原生 USB-CDC(板载 USB 口),日志不会出现在 FTDI 的 COM4 上。
  ; 要用 FTDI(UART0/COM4)抓启动日志时,临时注释掉下面这行即可。
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED
  -DSMOOTH_FONT
  -DST7796_DRIVER
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=10
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=14
  -DTFT_DC=13
  -DTFT_RST=9
  -DTFT_BL=21
  -DSPI_FREQUENCY=27000000
lib_deps =
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit NeoPixel @ ^1.12.3
  bodmer/TFT_eSPI @ ^2.5.43
  tzapu/WiFiManager @ ^2.0.17
  knolleary/PubSubClient @ ^2.8.0
