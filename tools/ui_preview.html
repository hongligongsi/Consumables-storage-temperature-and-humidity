<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能耗材仓 UI 设计参考 · 480x320</title>
  <style>
    /* ============================================================
   * 主题令牌
   * 夜间(night)= 固件当前配色,由 tft_ui.cpp 的 RGB565 常量精确换算:
   *   BG 0x0861 / PANEL 0x10E3 / PANEL_ALT 0x1924 / BORDER 0x31A6
   *   MUTED 0x9CF3 / ACCENT 0x06DD / GOOD 0x4E69 / WARN 0xFD20
   * 日间(day) = 设计提案(固件尚未实现),语义色在白底上加深以保证对比度。
   * 所有界面元素只引用变量,换主题只需切换 :root[data-theme]。
   * ============================================================ */
    :root {
      --page-bg: #f4f5f4;
      --page-text: #1b2420;
      --page-muted: #66706a;
      --chip-bg: #ffffff;
      --chip-border: #c4ccc6;
      --chip-on-bg: #e3f6ee;
      --chip-on-border: #0f9d63;
      --chip-on-text: #005a35;
      --bezel: #11151a;
    }

    /* 属性挂在 .doc 容器上(非 <html>),用无主属性选择器让内部 SVG 继承变量。 */
    [data-theme="night"] {
      --bg: #080c08;
      --panel: #101c18;
      --panel-alt: #182421;
      --border: #313531;
      --muted: #9c9e9c;
      --text: #ffffff;
      --active: #212821;
      --accent: #00dbef;
      --warn: #ffa600;
      --good: #4ace4a;
      --maroon: #7b0000;
      --g-red: #f80000;
      --g-yellow: #ffff00;
      --g-magenta: #f800f8;
      --g-cyan: #00ffff;
    }

    [data-theme="day"] {
      --bg: #e9ede8;
      --panel: #ffffff;
      --panel-alt: #dfe5e0;
      --border: #b7bfb7;
      --muted: #606b60;
      --text: #16201b;
      --active: #d2e9de;
      --accent: #008a9c;
      --warn: #c9740a;
      --good: #2e9e4f;
      --maroon: #a8403c;
      --g-red: #d93025;
      --g-yellow: #b89400;
      --g-magenta: #b02fb0;
      --g-cyan: #008a9c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--page-bg);
      color: var(--page-text);
      font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }

    .doc {
      width: min(960px, 100%);
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    .sub {
      color: var(--page-muted);
      font-size: 13px;
      margin: 0 0 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .seg {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .seg>span {
      font-size: 12px;
      color: var(--page-muted);
      margin-right: 2px;
    }

    .seg button {
      font: 500 13px/1.4 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--page-muted);
      cursor: pointer;
    }

    .seg button[aria-pressed="true"] {
      border-color: var(--chip-on-border);
      background: var(--chip-on-bg);
      color: var(--chip-on-text);
    }

    .bezel {
      background: var(--bezel);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    }

    .screen-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      background: var(--bg);
    }

    .caption {
      margin-top: 10px;
      font-size: 12px;
      color: var(--page-muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: var(--page-muted);
      border-top: 1px solid var(--chip-border);
      padding-top: 12px;
    }

    /* ------- SVG 主题绑定(全部走变量) ------- */
    .fill-bg {
      fill: var(--bg);
    }

    .fill-panel {
      fill: var(--panel);
    }

    .fill-alt {
      fill: var(--panel-alt);
    }

    .fill-active {
      fill: var(--active);
    }

    .stroke-border {
      stroke: var(--border);
    }

    .stroke-text {
      stroke: var(--text);
    }

    .stroke-accent {
      stroke: var(--accent);
    }

    .stroke-warn {
      stroke: var(--warn);
    }

    .stroke-good {
      stroke: var(--good);
    }

    .stroke-red {
      stroke: var(--g-red);
    }

    .t {
      fill: var(--text);
    }

    .m {
      fill: var(--muted);
    }

    .a {
      fill: var(--accent);
    }

    .w {
      fill: var(--warn);
    }

    .g {
      fill: var(--good);
    }

    .gc-red {
      color: var(--g-red);
    }

    .gc-green {
      color: var(--good);
    }

    .gc-yellow {
      color: var(--g-yellow);
    }

    .gc-warn {
      color: var(--warn);
    }

    .gc-magenta {
      color: var(--g-magenta);
    }

    .gc-cyan {
      color: var(--g-cyan);
    }

    .gc-text {
      color: var(--text);
    }

    /* ------- 语言 / 界面切换 ------- */
    [data-lang="zh"] .en,
    [data-lang="en"] .zh {
      display: none;
    }

    .scr {
      display: none;
    }

    [data-screen="main"] #scr-main,
    [data-screen="material"] #scr-material,
    [data-screen="system"] #scr-system,
    [data-screen="calib"] #scr-calib,
    [data-screen="fault"] #scr-fault {
      display: inline;
    }
  </style>
</head>

<body>

  <script>
    (function () {
      var root = document.querySelector('.doc');
      var captions = {
        zh: {
          main: '主界面 · 左侧控制区 + 右侧 2×4 仪表 + 底部五键(焦点:系统设置)',
          material: '耗材设置 · 6 项参数;旋转修改 / 单击下一项 / 长按保存返回',
          system: '系统设置 · 共 18 项,每屏 5 行;末项“固件版本”只读,显示 1.0.0',
          calib: '触摸校准 · 四角十字引导(无触摸屏机型显示“不支持”)',
          fault: '故障告警 · AHT20 / NTC / INA226 在线状态(NTC 离线)'
        },
        en: {
          main: 'Main · control zone + 2x4 gauges + five bottom keys (focus: SETTINGS)',
          material: 'Material · 6 fields; TURN edit / CLICK next / HOLD save+back',
          system: 'System · 18 fields, 5 rows; FIRMWARE VERSION is read-only (1.0.0)',
          calib: 'Calibration · corner crosshair (shown as N/A without touch panel)',
          fault: 'Fault · AHT20 / NTC / INA226 health (NTC offline)'
        }
      };
      var modeLabel = { zh: '中文', en: 'English' };
      var themeLabel = { night: '夜间', day: '日间' };
      var capScreen = document.getElementById('cap-screen');
      var capMode = document.getElementById('cap-mode');

      function refresh() {
        var lang = root.getAttribute('data-lang');
        var theme = root.getAttribute('data-theme');
        var screen = root.getAttribute('data-screen');
        document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
        capScreen.textContent = captions[lang][screen];
        capMode.textContent = modeLabel[lang] + ' · ' + themeLabel[theme];
        document.querySelectorAll('.seg button').forEach(function (btn) {
          var key = btn.getAttribute('data-set');
          var val = btn.getAttribute('data-val');
          btn.setAttribute('aria-pressed', root.getAttribute('data-' + key) === val ? 'true' : 'false');
        });
      }

      document.querySelectorAll('.seg button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          root.setAttribute('data-' + btn.getAttribute('data-set'), btn.getAttribute('data-val'));
          refresh();
        });
      });
      refresh();
    })();
  </script>
