<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>WiFi Setup</title>
<style>.c,body{text-align:center;font-family:verdana}div,input,select{padding:5px;font-size:1em;margin:5px 0;box-sizing:border-box}input,button,select,.msg{border-radius:.3rem;width: 100%}input[type=radio],input[type=checkbox]{width:auto}button,input[type='button'],input[type='submit']{cursor:pointer;border:0;background-color:#1fa3ec;color:#fff;line-height:2.4rem;font-size:1.2rem;width:100%}input[type='file']{border:1px solid #1fa3ec}.wrap {text-align:left;display:inline-block;min-width:260px;max-width:500px}a{color:#000;font-weight:700;text-decoration:none}a:hover{color:#1fa3ec;text-decoration:underline}.q{height:16px;margin:0;padding:0 5px;text-align:right;min-width:38px;float:right}.q.q-0:after{background-position-x:0}.q.q-1:after{background-position-x:-16px}.q.q-2:after{background-position-x:-32px}.q.q-3:after{background-position-x:-48px}.q.q-4:after{background-position-x:-64px}.q.l:before{background-position-x:-80px;padding-right:5px}.ql .q{float:left}.q:after,.q:before{content:'';width:16px;height:16px;display:inline-block;background-repeat:no-repeat;background-position: 16px 0;background-image:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAAAQCAMAAADeZIrLAAAAJFBMVEX///8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADHJj5lAAAAC3RSTlMAIjN3iJmqu8zd7vF8pzcAAABsSURBVHja7Y1BCsAwCASNSVo3/v+/BUEiXnIoXkoX5jAQMxTHzK9cVSnvDxwD8bFx8PhZ9q8FmghXBhqA1faxk92PsxvRc2CCCFdhQCbRkLoAQ3q/wWUBqG35ZxtVzW4Ed6LngPyBU2CobdIDQ5oPWI5nCUwAAAAASUVORK5CYII=');}@media (-webkit-min-device-pixel-ratio: 2),(min-resolution: 192dpi){.q:before,.q:after {background-image:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALwAAAAgCAMAAACfM+KhAAAALVBMVEX///8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAOrOgAAAADnRSTlMAESIzRGZ3iJmqu8zd7gKjCLQAAACmSURBVHgB7dDBCoMwEEXRmKlVY3L//3NLhyzqIqSUggy8uxnhCR5Mo8xLt+14aZ7wwgsvvPA/ofv9+44334UXXngvb6XsFhO/VoC2RsSv9J7x8BnYLW+AjT56ud/uePMdb7IP8Bsc/e7h8Cfk912ghsNXWPpDC4hvN+D1560A1QPORyh84VKLjjdvfPFm++i9EWq0348XXnjhhT+4dIbCW+WjZim9AKk4UZMnnCEuAAAAAElFTkSuQmCC');background-size: 95px 16px;}}.msg{padding:20px;margin:20px 0;border:1px solid #eee;border-left-width:5px;border-left-color:#777}.msg h4{margin-top:0;margin-bottom:5px}.msg.P{border-left-color:#1fa3ec}.msg.P h4{color:#1fa3ec}.msg.D{border-left-color:#dc3630}.msg.D h4{color:#dc3630}.msg.S{border-left-color: #5cb85c}.msg.S h4{color: #5cb85c}dt{font-weight:bold}dd{margin:0;padding:0 0 0.5em 0;min-height:12px}td{vertical-align: top;}.h{display:none}button{transition: 0s opacity;transition-delay: 3s;transition-duration: 0s;cursor: pointer}button.D{background-color:#dc3630}button:active{opacity:50% !important;cursor:wait;transition-delay: 0s}body.invert,body.invert a,body.invert h1 {background-color:#060606;color:#fff;}body.invert .msg{color:#fff;background-color:#282828;border-top:1px solid #555;border-right:1px solid #555;border-bottom:1px solid #555;}body.invert .q[role=img]{-webkit-filter:invert(1);filter:invert(1);}:disabled {opacity: 0.5;}</style>

<style>
/* 实验室蓝 · Lab Blue [浅色 · 日光可读] —— token 见下,与 Web 管理页同源 */
body.chamber{color-scheme:light;background:#F2F5F9;color:#16202C;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;margin:0;padding:18px}
body.chamber .wrap{display:block;min-width:0;max-width:560px;margin:0 auto;text-align:left}
body.chamber .ch-brand{background:#FFFFFF;border:1px solid #D3DEEA;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(16,24,32,.05)}
body.chamber .ch-brand strong{display:block;color:#16202C;font-size:1.35rem;font-weight:600;margin-bottom:5px}
body.chamber .ch-brand span{color:#6B7C8F}
body.chamber h1,body.chamber h3{color:#16202C}
body.chamber a{color:#16202C;font-weight:600}
body.chamber a:hover{color:#2563EB}
body.chamber .network-row{background:#FFFFFF;border:1px solid #D3DEEA;border-radius:9px;padding:10px 12px;margin:7px 0;min-height:24px}
body.chamber a[data-ssid]{display:inline-block;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
body.chamber .net-security{display:inline-block;color:#6B7C8F;background:#E9EFF6;border-radius:999px;padding:2px 7px;margin-left:7px;font-size:.78rem;vertical-align:middle}
body.chamber label{color:#16202C;font-weight:600}
body.chamber input{background:#FFFFFF;color:#16202C;border:1px solid #D3DEEA;border-radius:8px;padding:11px;margin:6px 0 12px}
body.chamber input:focus{border-color:#2563EB;outline:2px solid rgba(37,99,235,.22)}
body.chamber button{background:#2563EB;color:#FFFFFF;border-radius:8px;font-weight:600}
body.chamber button:hover{background:#1D4ED8}
body.chamber button.D{background:#DC2626}
body.chamber .msg{background:#FFFFFF;color:#16202C;border:1px solid #D3DEEA;border-left:5px solid #2563EB;border-radius:8px;box-shadow:0 1px 2px rgba(16,24,32,.05)}
body.chamber .msg.D{border-left-color:#DC2626}
body.chamber .msg.S{border-left-color:#16A34A}
body.chamber .msg h4{color:#16202C}
body.chamber .q{color:#6B7C8F}
body.chamber .q[role=img]{-webkit-filter:none;filter:none}
body.chamber .ch-help{color:#6B7C8F;margin:-6px 0 10px;font-size:.9rem}
body.chamber .ch-section{color:#2563EB;font-size:1rem;font-weight:600;margin:18px 0 8px}
body.chamber #ch-connect-progress{background:#FFFFFF;border:1px solid #D3DEEA;border-left:5px solid #D97706;border-radius:8px;padding:13px;margin:12px 0;color:#16202C}
@media(max-width:420px){body.chamber{padding:10px}body.chamber a[data-ssid]{max-width:50%}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var zh=document.body.classList.contains('zh');
  var wrap=document.querySelector('.wrap');
  if(!wrap)return;

  var brand=document.createElement('div');
  brand.className='ch-brand';
  brand.innerHTML='<strong>'+(zh?'耗材仓网络配置':'Filament Chamber WiFi Setup')+'</strong><span>'+(zh?'连接 2.4 GHz WiFi，设备不支持 5 GHz':'Connect to a 2.4 GHz network; 5 GHz is not supported')+'</span>';
  wrap.insertBefore(brand,wrap.firstChild);

  // The captive portal landing page only contains a menu. Start an async scan
  // first, then send the user to the full network form.
  if(location.pathname==='/'){
    var note=document.createElement('div');
    note.className='msg';
    note.textContent=zh?'正在扫描附近 WiFi，首次扫描约需 8 秒…':'Scanning nearby WiFi networks; the first scan takes about 8 seconds…';
    brand.insertAdjacentElement('afterend',note);
    setTimeout(function(){location.replace('/wifi');},8500);
  }

  var replacements=zh?[
    ['Configure WiFi (No scan)','手动配置 WiFi'],['Configure WiFi','配置 WiFi'],
    ['Show Password','显示密码'],['Password','WiFi 密码'],
    ['Saving Credentials','正在保存网络凭据'],['Trying to connect ESP to network.','正在连接所选 WiFi。'],
    ['If it fails reconnect to AP to try again','如果连接失败，请重新连接配置热点后再试'],
    ['Authentication failure','密码错误或认证失败'],['AP not found','未找到该 WiFi'],
    ['Could not connect','连接失败，请检查信号和密码'],['Not connected','尚未连接'],
    ['Connected','已连接'],['No AP set','尚未配置 WiFi'],['with IP','设备地址'],
    ['Refresh','重新扫描'],['Save','保存并连接'],['Back','返回'],
    ['SSID','WiFi 名称（SSID）']
  ]:[];
  if(replacements.length){
    var walker=document.createTreeWalker(wrap,NodeFilter.SHOW_TEXT);
    var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(function(node){
      var value=node.nodeValue;
      replacements.forEach(function(pair){value=value.split(pair[0]).join(pair[1]);});
      node.nodeValue=value;
    });
  }

  var ssid=document.getElementById('s');
  if(ssid){
    var help=document.createElement('div');
    help.className='ch-help';
    help.textContent=zh?'从上方列表选择，或在此手动输入隐藏网络名称。':'Choose a network above, or manually enter a hidden SSID.';
    ssid.insertAdjacentElement('afterend',help);
  }

  document.querySelectorAll('a[data-ssid]').forEach(function(link){
    var row=link.parentElement;
    row.classList.add('network-row');
    var secure=!!row.querySelector('.q.l');
    var badge=document.createElement('span');
    badge.className='net-security';
    badge.textContent=secure?(zh?'加密':'Secured'):(zh?'开放':'Open');
    link.insertAdjacentElement('afterend',badge);
    var quality=row.querySelector('.q:not(.h)');
    if(quality)quality.setAttribute('aria-label',(zh?'信号强度 ':'Signal strength ')+quality.textContent.trim());
  });

  var form=document.querySelector("form[action='wifisave']");
  if(form){
    var section=document.createElement('div');
    section.className='ch-section';
    section.textContent=zh?'手动输入':'Manual entry';
    form.insertBefore(section,form.firstChild);
    form.addEventListener('submit',function(){
      var old=document.getElementById('ch-connect-progress');if(old)old.remove();
      var progress=document.createElement('div');
      progress.id='ch-connect-progress';progress.setAttribute('role','status');
      progress.textContent=zh?'正在保存并连接，请稍候…':'Saving and connecting, please wait…';
      form.insertBefore(progress,form.firstChild);
      var button=form.querySelector("button[type='submit']");if(button)button.disabled=true;
    });
  }

  var pageText=wrap.textContent||'';
  if(pageText.indexOf('正在保存网络凭据')>=0||pageText.indexOf('Saving Credentials')>=0){
    setTimeout(function(){location.replace('/wifi');},17000);
  }
});
</script>

</head><body class='chamber zh'><div class='wrap'>
<h1>WiFi Config</h1>
<div class='msg P'><strong>Not connected</strong> to HomeWiFi</div>
<div><a href='#p' onclick='c(this)' data-ssid='HomeWiFi'>HomeWiFi</a><div role='img' aria-label='92%' title='92%' class='q q-4'></div><div class='q'>92%</div></div><div><a href='#p' onclick='c(this)' data-ssid='Printer-Room'>Printer-Room</a><div role='img' aria-label='76%' title='76%' class='q q-3'></div><div class='q'>76%</div></div><div><a href='#p' onclick='c(this)' data-ssid='Workshop-IoT'>Workshop-IoT</a><div role='img' aria-label='58%' title='58%' class='q q-2'></div><div class='q'>58%</div></div><div><a href='#p' onclick='c(this)' data-ssid='Guest'>Guest</a><div role='img' aria-label='34%' title='34%' class='q q-1'></div><div class='q'>34%</div></div>
<br/><form action='/wifi?refresh=1' method='POST'><button name='refresh' value='1'>Refresh</button></form>
<form method='POST' action='wifisave'>
<label for='s'>SSID</label><input id='s' name='s' maxlength='32' autocorrect='off' autocapitalize='none' placeholder='HomeWiFi'><br/>
<label for='p'>Password</label><input id='p' name='p' maxlength='64' type='password' placeholder='pwd'><input type='checkbox' id='showpass' onclick='f()'> <label for='showpass'>Show Password</label><br/>
<br/><br/><button type='submit'>Save</button></form>
<hr><br/><form action='/' method='get'><button>Back</button></form>
</div></body></html>
